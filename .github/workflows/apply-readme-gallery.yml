name: Apply README gallery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply README gallery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode screenshots
        shell: bash
        run: |
          set -e
          mkdir -p assets/readme
          base64 -d .tmp-readme-gallery.zip.b64 > /tmp/readme-gallery.zip
          unzip -o /tmp/readme-gallery.zip -d assets/readme
      - name: Update README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # EVE rebirth terror 한국어 패치

          Nintendo Switch판 **EVE rebirth terror** 비공식 한국어 패치입니다.

          최신 버전 다운로드 및 자세한 적용 방법은 **Releases**를 확인해 주세요.

          ## 지원 게임 버전

          - **EVE rebirth terror 일본판**
          - **업데이트 1.0.2**

          ## 한국어화 범위

          ### 대사 / 이벤트

          스토리 대사 및 이벤트 텍스트의 **한글화 및 검수를 완료했습니다.**

          ![대사 화면 1](assets/readme/dialogue-01.jpg)
          ![대사 화면 2](assets/readme/dialogue-02.jpg)

          ### 조사·행동 선택 메뉴

          조사, 이동, 대화 등 게임 진행에 사용되는 **조사·행동 선택 메뉴를 번역했습니다.**

          일부 선택지는 원본 이미지에 포함된 일본어가 함께 표시될 수 있습니다.

          ![조사·행동 선택 메뉴 1](assets/readme/action-01.jpg)
          ![조사·행동 선택 메뉴 2](assets/readme/action-02.jpg)
          ![조사·행동 선택 메뉴 3](assets/readme/action-03.jpg)

          ## 미번역 영역

          아래 영역은 현재 일본어로 표시되며 **추가 번역 예정이 없습니다.**

          ### 타이틀 화면

          **미번역 / 번역 예정 없음**

          ![타이틀 화면 1](assets/readme/title-01.jpg)
          ![타이틀 화면 2](assets/readme/title-02.jpg)

          ### 옵션 화면

          **미번역 / 번역 예정 없음**

          ![옵션 화면](assets/readme/options.jpg)

          ### 지도 화면

          일본어와 함께 영어 표기가 제공되어 **추가 번역 예정이 없습니다.**

          ![지도 화면](assets/readme/map.jpg)

          ## 다운로드

          최신 한국어 패치는 **Releases**에서 받을 수 있습니다.

          배포 파일에 포함된 `설명서.txt` 또는 해당 버전의 Release 안내를 참고해 주세요.

          ## 오류 및 번역 제보

          오역, 오탈자, 미번역, 호칭·말투 문제 또는 패치 적용 오류를 발견하셨다면 **Issues**를 통해 제보해 주세요.

          가능하면 발생 장면과 스크린샷을 함께 첨부해 주시면 확인에 도움이 됩니다.

          ## 배포 안내

          본 패치는 팬 제작 비공식 한국어 패치입니다.

          원작 및 관련 콘텐츠의 저작권과 상표권은 각 권리자에게 있습니다.

          **본 패치는 게임 원본 파일을 포함하지 않으며, 패치 파일만 제공합니다.**

          본 패치의 상업적 판매 및 유료 배포, 원본 게임과 합본 형태의 재배포를 금지합니다.
          EOF
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md assets/readme
          git commit -m 'Update README with screenshots' || exit 0
          git push

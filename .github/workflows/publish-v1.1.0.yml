name: Publish v1.1.0 release

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[release] publish v1.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Release v1.1.0 already exists.'
            exit 0
          fi
          gh release create v1.1.0 \
            --target "${GITHUB_SHA}" \
            --title 'EVE rebirth terror 한국어 패치 v1.1.0' \
            --notes-file RELEASE_NOTES_v1.1.0.md \
            --latest
